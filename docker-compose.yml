services:
  postgres:
    image: postgres:17
    container_name: pipelinepilot-postgres
    environment:
      POSTGRES_USER: pipelinepilot
      POSTGRES_PASSWORD: pipelinepilot
      POSTGRES_DB: pipelinepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinepilot -d pipelinepilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: